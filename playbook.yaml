- name: Prepare 3x-ui server
  hosts: webservers
  become: true

  vars:
    xui_version: "v3.7.0"
    xui_installer_path: "/var/tmp/3x-ui-install-{{ xui_version }}.sh"
    xui_install_state_path: "/etc/x-ui/ansible-installed-version"
    xui_release_script_url: "https://raw.githubusercontent.com/MHSanaei/3x-ui/{{ xui_version }}/install.sh"
    xui_panel_port: "2053"
    xui_web_base_path: "panel"
    xui_ssl_mode: "none"
    xui_db_type: "sqlite"
    xui_domain: ""
    certbot_email: ""
    xui_certificate_dir: "/etc/letsencrypt/live/{{ xui_domain }}"

  tasks:
    - name: Update apt cache and install packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - curl
          - wget
          - jq
          - bash
          - sudo
          - nginx-full
          - certbot
          - sqlite3
          - ufw
          - netcat-openbsd
          - mtr
          - python3
          - libcap2-bin
        state: present
    - name: Install CA certificates
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        install_recommends: false
    - name: Configure UFW rules
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "22", proto: "tcp" }
        - { port: "80", proto: "tcp" }
        - { port: "443", proto: "tcp" }
        - { port: "443", proto: "udp" }
    - name: Enable UFW
      community.general.ufw:
        state: enabled
    - name: Enable and start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Read the 3x-ui installation state
      ansible.builtin.slurp:
        src: "{{ xui_install_state_path }}"
      register: xui_install_state
      failed_when: false
      changed_when: false

    - name: Decide whether 3x-ui needs installation
      ansible.builtin.set_fact:
        xui_needs_install: >-
          {{ not xui_install_state['content'] is defined or
             (xui_install_state['content'] | b64decode | trim) != xui_version }}

    - name: Ensure the backup directory exists
      ansible.builtin.file:
        path: /var/backups/x-ui
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: xui_needs_install

    - name: Check whether the 3x-ui database exists
      ansible.builtin.stat:
        path: /etc/x-ui/x-ui.db
      register: xui_database
      when: xui_needs_install

    - name: Back up the 3x-ui database before installation
      ansible.builtin.command:
        argv:
          - sqlite3
          - /etc/x-ui/x-ui.db
          - ".backup '/var/backups/x-ui/x-ui.db'"
      when: xui_needs_install and xui_database.stat.exists
      changed_when: true

    - name: Download the pinned 3x-ui installer
      ansible.builtin.get_url:
        url: "{{ xui_release_script_url }}"
        dest: "{{ xui_installer_path }}"
        owner: root
        group: root
        mode: "0700"
      when: xui_needs_install

    - name: Run the pinned 3x-ui installer
      ansible.builtin.command:
        cmd: "{{ xui_installer_path }} {{ xui_version }}"
      environment:
        XUI_NONINTERACTIVE: "1"
        XUI_PANEL_PORT: "{{ xui_panel_port }}"
        XUI_WEB_BASE_PATH: "{{ xui_web_base_path }}"
        XUI_SSL_MODE: "{{ xui_ssl_mode }}"
        XUI_DB_TYPE: "{{ xui_db_type }}"
      register: xui_install_result
      when: xui_needs_install
      changed_when: true

    - name: Record the installed 3x-ui version
      ansible.builtin.copy:
        content: "{{ xui_version }}\n"
        dest: "{{ xui_install_state_path }}"
        owner: root
        group: root
        mode: "0600"
      when: xui_needs_install and xui_install_result.rc == 0

    - name: Ensure the 3x-ui service is enabled and running
      ansible.builtin.service:
        name: x-ui
        state: started
        enabled: true

    - name: Check the 3x-ui service
      ansible.builtin.command:
        cmd: systemctl is-active x-ui
      register: xui_service_status
      changed_when: false

    - name: Verify that 3x-ui is running
      ansible.builtin.assert:
        that:
          - xui_service_status.rc == 0
          - xui_service_status.stdout | trim == "active"
        fail_msg: "The x-ui service is not active. Check: journalctl -u x-ui"

    - name: Read the x-ui settings
      ansible.builtin.command:
        cmd: /usr/local/x-ui/x-ui setting -show true
      register: xui_settings
      changed_when: false

    - name: Bind x-ui to localhost
      ansible.builtin.command:
        cmd: /usr/local/x-ui/x-ui setting -listenIP 127.0.0.1
      register: xui_listen_update
      when: "'listenIP: 127.0.0.1' not in xui_settings.stdout"
      changed_when: true

    - name: Restart x-ui after changing its listen address
      ansible.builtin.service:
        name: x-ui
        state: restarted
      when: xui_listen_update.changed | default(false)

    - name: Require an nginx domain
      ansible.builtin.assert:
        that:
          - xui_domain | length > 0
        fail_msg: "Set xui_domain before running the playbook."

    - name: Check whether the TLS certificate exists
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ xui_certificate_dir }}/fullchain.pem"
        - "{{ xui_certificate_dir }}/privkey.pem"
      register: xui_certificate_files

    - name: Decide whether a TLS certificate is needed
      ansible.builtin.set_fact:
        xui_certificate_needed: >-
          {{ xui_certificate_files.results | selectattr('stat.exists', 'equalto', false) | list | length > 0 }}

    - name: Require certificate settings when issuing a certificate
      ansible.builtin.assert:
        that:
          - xui_domain | length > 0
          - certbot_email | length > 0
        fail_msg: "Set xui_domain and certbot_email before the first run."
      when: xui_certificate_needed

    - name: Stop nginx for standalone certificate issuance
      ansible.builtin.service:
        name: nginx
        state: stopped
      when: xui_certificate_needed

    - name: Issue the TLS certificate with Certbot
      block:
        - name: Run Certbot in standalone mode
          ansible.builtin.command:
            argv:
              - certbot
              - certonly
              - --standalone
              - --non-interactive
              - --agree-tos
              - --email
              - "{{ certbot_email }}"
              - --domain
              - "{{ xui_domain }}"
              - --pre-hook
              - systemctl stop nginx
              - --post-hook
              - systemctl start nginx
              - --deploy-hook
              - systemctl reload nginx
          register: certbot_result
          changed_when: true
      always:
        - name: Start nginx after certificate issuance
          ansible.builtin.service:
            name: nginx
            state: started
            enabled: true
      when: xui_certificate_needed

    - name: Remove the default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      register: nginx_default_site

    - name: Install the nginx reverse proxy configuration
      ansible.builtin.template:
        src: 3x-ui-nginx.conf.j2
        dest: /etc/nginx/sites-available/3x-ui.conf
        owner: root
        group: root
        mode: "0644"
      register: nginx_config

    - name: Enable the 3x-ui nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/3x-ui.conf
        dest: /etc/nginx/sites-enabled/3x-ui.conf
        state: link
        owner: root
        group: root
      register: nginx_site

    - name: Validate the nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test
      changed_when: false

    - name: Reload nginx with the validated configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: nginx_default_site.changed or nginx_config.changed or nginx_site.changed
