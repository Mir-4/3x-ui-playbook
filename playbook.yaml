- name: Prepare 3x-ui server
  hosts: webservers
  become: true

  pre_tasks:
    - name: Validate deployment inputs
      ansible.builtin.import_tasks: tasks/preflight.yaml

  handlers:
    - name: Validate nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      listen: nginx configuration changed

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: xui_nginx_manage_service | default(true) | bool
      listen: nginx configuration changed
    - name: Restart x-ui after changing its listen address
      ansible.builtin.service:
        name: x-ui
        state: restarted
      listen: xui listen address changed

  tasks:
    - name: Prepare the host baseline
      ansible.builtin.import_tasks: tasks/host-baseline.yaml

    - name: Install and configure 3x-ui
      ansible.builtin.import_tasks: tasks/xui-lifecycle.yaml

    - name: Manage TLS certificates
      ansible.builtin.import_tasks: tasks/certificates.yaml

    - name: Configure two-domain Nginx
      ansible.builtin.import_tasks: tasks/nginx.yaml
