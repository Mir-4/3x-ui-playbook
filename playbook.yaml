- name: Prepare 3x-ui server
  hosts: webservers
  become: true

  tasks:
    - name: Update apt cache and install packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - curl
          - wget
          - jq
          - bash
          - sudo
          - nginx-full
          - certbot
          - python3-certbot-nginx
          - sqlite3
          - ufw
          - netcat-openbsd
          - mtr
          - python3
          - libcap2-bin
        state: present
    - name: Enable and start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    - name: Install CA certificates
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        install_recommends: false
    - name: Configure UFW rules
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "22", proto: "tcp" }
        - { port: "80", proto: "tcp" }
        - { port: "443", proto: "tcp" }
        - { port: "443", proto: "udp" }
    - name: Enable UFW
      community.general.ufw:
        state: enabled
