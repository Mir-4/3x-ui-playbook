---
- name: Require supported host group reconciliation mode
  ansible.builtin.assert:
    that:
      - xui_config_phase in ['plan', 'apply', 'verify']
    fail_msg: Unsupported host group reconciliation phase.

- name: Validate managed host group identities
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.inbound_tag | default('') in xui_managed_inbound_tags
      - item.payload | default(none) is mapping
      - item.payload.groupId | default('') is match('^[A-Za-z0-9_-]{1,64}$')
      - item.payload.hosts | default(none) is sequence
      - item.payload.hosts | default(none) is not string
      - item.payload.hosts | length > 0
      - item.payload.port | default(none) is number
      - item.payload.security | default('') in ['same', 'tls', 'none', 'reality']
    fail_msg: Each managed host group needs a valid identity, inbound tag, hosts, port, and security mode.
  loop: "{{ xui_managed_host_groups }}"
  loop_control:
    label: "{{ item.name | default('invalid') }}"
  no_log: true

- name: Collect managed host group identities
  ansible.builtin.set_fact:
    xui_managed_host_group_names: "{{ xui_managed_host_groups | map(attribute='name') | list }}"
    xui_managed_host_group_ids: "{{ xui_managed_host_groups | map(attribute='payload.groupId') | list }}"
  no_log: true

- name: Reject duplicate managed host group identities
  ansible.builtin.assert:
    that:
      - xui_managed_host_group_names | unique | length == xui_managed_host_group_names | length
      - xui_managed_host_group_ids | unique | length == xui_managed_host_group_ids | length
    fail_msg: Managed host group names and group IDs must be unique.

- name: Build managed inbound ID map
  ansible.builtin.set_fact:
    xui_managed_inbound_id_by_tag: >-
      {{ xui_managed_inbound_id_by_tag | default({})
         | combine({item.tag: item.id}) }}
  loop: "{{ xui_discovered_inbounds | selectattr('tag', 'in', xui_managed_inbound_tags) | list }}"
  loop_control:
    label: "{{ item.tag }}"
  no_log: true

- name: Require every managed inbound to exist before host reconciliation
  ansible.builtin.assert:
    that:
      - item.payload.tag in xui_managed_inbound_id_by_tag
    fail_msg: Managed inbound {{ item.payload.tag }} is missing; host group reconciliation cannot continue.
  loop: "{{ xui_managed_inbounds }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Read host groups
  ansible.builtin.uri:
    url: "{{ xui_api_base_url }}/hosts/list"
    method: GET
    headers:
      Authorization: "Bearer {{ xui_api_token }}"
    return_content: true
    status_code: 200
  register: xui_host_groups_response
  changed_when: false
  check_mode: false
  no_log: true
  failed_when: >-
    xui_host_groups_response.status | default(0) != 200 or
    xui_host_groups_response.json.success | default(false) != true or
    xui_host_groups_response.json.obj | default(none) is not sequence or
    xui_host_groups_response.json.obj | default(none) is string

- name: Validate host group response fields
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.groupId | default(none) is string
      - item.hosts | default(none) is sequence
      - item.hosts | default(none) is not string
      - item.inboundIds | default(none) is sequence
      - item.inboundIds | default(none) is not string
    fail_msg: The host group API returned an unsupported record shape.
  loop: "{{ xui_host_groups_response.json.obj }}"
  loop_control:
    label: "{{ item.groupId | default('unknown') }}"
  no_log: true

- name: Collect current host group IDs
  ansible.builtin.set_fact:
    xui_discovered_host_groups: "{{ xui_host_groups_response.json.obj }}"
    xui_discovered_host_group_ids: "{{ xui_host_groups_response.json.obj | map(attribute='groupId') | list }}"
  no_log: true

- name: Reject duplicate current host group IDs
  ansible.builtin.assert:
    that:
      - xui_discovered_host_group_ids | unique | length == xui_discovered_host_group_ids | length
    fail_msg: The host group API returned duplicate group IDs. Resolve them before reconciliation.

- name: Initialize host group reconciliation plan
  ansible.builtin.set_fact:
    xui_managed_host_group_plan: []
  no_log: true

- name: Plan managed host group reconciliation
  ansible.builtin.set_fact:
    xui_managed_host_group_plan: >-
      {{ xui_managed_host_group_plan
         + [{
           'name': item.name,
           'groupId': desired_payload.groupId,
           'action': (
             'create' if current_matches | length == 0
             else 'no-op' if current_payload_subset == desired_payload
             else 'update'
           ),
           'desired_payload': desired_payload,
           'api_payload': desired_payload
         }] }}
  vars:
    host_group_defaults:
      allowInsecure: false
      alpn: []
      echConfigList: ""
      excludeFromSubTypes: []
      finalMask: ""
      fingerprint: ""
      hostHeader: ""
      inboundIds: "{{ [xui_managed_inbound_id_by_tag[item.inbound_tag] | int] }}"
      isDisabled: false
      isHidden: false
      keepSniBlank: false
      mihomoIpVersion: dual
      mihomoX25519: false
      muxParams: ""
      nodeGuids: []
      overrideSniFromAddress: false
      path: ""
      pinnedPeerCertSha256: []
      serverDescription: ""
      shuffleHost: false
      sni: ""
      sockoptParams: ""
      sortOrder: 0
      tags:
        - ansible-managed
      verifyPeerCertByName: ""
      vlessRoute: ""
    desired_payload: "{{ host_group_defaults | combine(item.payload, recursive=true) }}"
    current_matches: >-
      {{ xui_discovered_host_groups
         | selectattr('groupId', 'equalto', item.payload.groupId)
         | list }}
    current_group: "{{ current_matches | first | default({}) }}"
    current_payload_subset: >-
      {{ current_group
         | dict2items
         | selectattr('key', 'in', desired_payload.keys() | list)
         | items2dict
         if current_matches | length == 1 else {} }}
  loop: "{{ xui_managed_host_groups }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Collect managed host group changes
  ansible.builtin.set_fact:
    xui_managed_host_group_changes: >-
      {{ xui_managed_host_group_plan
         | rejectattr('action', 'equalto', 'no-op')
         | list }}
  no_log: true

- name: Show host group reconciliation plan
  ansible.builtin.debug:
    msg:
      current_count: "{{ xui_discovered_host_groups | length }}"
      changes: >-
        {{ xui_managed_host_group_changes
           | map(attribute='name')
           | zip(xui_managed_host_group_changes | map(attribute='action'))
           | map('join', ':')
           | list }}
  changed_when: >-
    ansible_check_mode and xui_managed_host_group_changes | length > 0

- name: Prepare host group database backup directory
  ansible.builtin.file:
    path: /var/backups/x-ui
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - xui_config_phase == 'apply'
    - xui_managed_host_group_changes | length > 0
    - not ansible_check_mode

- name: Set host group database backup path
  ansible.builtin.set_fact:
    xui_host_group_backup_path: >-
      /var/backups/x-ui/x-ui-host-groups-{{ ansible_date_time.iso8601_basic_short }}.db
  when:
    - xui_config_phase == 'apply'
    - xui_managed_host_group_changes | length > 0
    - not ansible_check_mode

- name: Back up database before host group changes
  ansible.builtin.command:
    argv:
      - sqlite3
      - /etc/x-ui/x-ui.db
      - ".backup '{{ xui_host_group_backup_path }}'"
  changed_when: true
  when:
    - xui_config_phase == 'apply'
    - xui_managed_host_group_changes | length > 0
    - not ansible_check_mode

- name: Create managed host groups
  ansible.builtin.uri:
    url: "{{ xui_api_base_url }}/hosts/add"
    method: POST
    headers:
      Authorization: "Bearer {{ xui_api_token }}"
    body_format: json
    body: "{{ item.api_payload }}"
    status_code: 200
  register: xui_host_group_create
  changed_when: true
  failed_when: >-
    xui_host_group_create.status | default(0) != 200 or
    xui_host_group_create.json.success | default(false) != true
  loop: "{{ xui_managed_host_group_changes | selectattr('action', 'equalto', 'create') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when:
    - xui_config_phase == 'apply'
    - not ansible_check_mode

- name: Update managed host groups
  ansible.builtin.uri:
    url: "{{ xui_api_base_url }}/hosts/update/{{ item.groupId }}"
    method: POST
    headers:
      Authorization: "Bearer {{ xui_api_token }}"
    body_format: json
    body: "{{ item.api_payload }}"
    status_code: 200
  register: xui_host_group_update
  changed_when: true
  failed_when: >-
    xui_host_group_update.status | default(0) != 200 or
    xui_host_group_update.json.success | default(false) != true
  loop: "{{ xui_managed_host_group_changes | selectattr('action', 'equalto', 'update') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when:
    - xui_config_phase == 'apply'
    - not ansible_check_mode

- name: Verify managed host groups converged
  ansible.builtin.assert:
    that:
      - xui_managed_host_group_changes | length == 0
    fail_msg: Managed host groups did not converge.
  when: xui_config_phase == 'verify'
