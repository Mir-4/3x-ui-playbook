---
- name: Require supported inbound reconciliation mode
  ansible.builtin.assert:
    that:
      - xui_config_phase in ['plan', 'apply', 'verify']
    fail_msg: Unsupported inbound reconciliation phase.

- name: Validate managed inbound identities
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.payload | default(none) is mapping
      - item.payload.tag | default('') is match('^ansible-[a-z0-9-]+$')
      - item.payload.listen | default(none) is string
      - item.payload.port | default(none) is number
    fail_msg: Each managed inbound needs a name, fixed tag, listener, and numeric port.
  loop: "{{ xui_managed_inbounds }}"
  loop_control:
    label: "{{ item.name | default('invalid') }}"
  no_log: true

- name: Collect managed inbound identities
  ansible.builtin.set_fact:
    xui_managed_inbound_names: >-
      {{ xui_managed_inbounds | map(attribute='name') | list }}
    xui_managed_inbound_tags: >-
      {{ xui_managed_inbounds | map(attribute='payload.tag') | list }}
    xui_managed_inbound_listener_keys: []

- name: Collect managed listener identities
  ansible.builtin.set_fact:
    xui_managed_inbound_listener_keys: >-
      {{ xui_managed_inbound_listener_keys
         + [item.payload.listen ~ ':' ~ (item.payload.port | string)] }}
  loop: "{{ xui_managed_inbounds }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Reject duplicate managed identities
  ansible.builtin.assert:
    that:
      - xui_managed_inbound_names | unique | length == xui_managed_inbound_names | length
      - xui_managed_inbound_tags | unique | length == xui_managed_inbound_tags | length
      - >-
        xui_managed_inbound_listener_keys | unique | length
        == xui_managed_inbound_listener_keys | length
    fail_msg: Managed inbound names, tags, and listeners must be unique.

- name: Read inbounds
  ansible.builtin.uri:
    url: "{{ xui_api_base_url }}/inbounds/list"
    method: GET
    headers:
      Authorization: "Bearer {{ xui_api_token }}"
    return_content: true
    status_code: 200
  register: xui_inbounds_response
  changed_when: false
  check_mode: false
  no_log: true
  failed_when: >-
    xui_inbounds_response.status | default(0) != 200 or
    xui_inbounds_response.json.success | default(false) != true or
    xui_inbounds_response.json.obj | default(none) is not sequence or
    xui_inbounds_response.json.obj | default(none) is string

- name: Validate inbound response fields
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.id | default(none) is number
      - item.tag | default(none) is string
      - item.listen | default(none) is string
      - item.port | default(none) is number
      - >-
        item.settings | default(none) is mapping or
        item.settings | default(none) is string
      - >-
        item.streamSettings | default(none) is mapping or
        item.streamSettings | default(none) is string
      - >-
        item.sniffing | default(none) is mapping or
        item.sniffing | default(none) is string
    fail_msg: The inbound API returned an unsupported record shape.
  loop: "{{ xui_inbounds_response.json.obj }}"
  loop_control:
    label: "{{ item.id | default('unknown') }}"
  no_log: true

- name: Initialize decoded inbounds
  ansible.builtin.set_fact:
    xui_discovered_inbounds: []

- name: Normalize inbound structured fields
  ansible.builtin.set_fact:
    xui_discovered_inbounds: >-
      {{ xui_discovered_inbounds
         + [item | combine({
           'settings': (
             item.settings
             if item.settings is mapping
             else item.settings | from_json
           ),
           'streamSettings': (
             item.streamSettings
             if item.streamSettings is mapping
             else item.streamSettings | from_json
           ),
           'sniffing': (
             item.sniffing
             if item.sniffing is mapping
             else item.sniffing | from_json
           )
         })] }}
  loop: "{{ xui_inbounds_response.json.obj }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true

- name: Validate decoded inbound fields
  ansible.builtin.assert:
    that:
      - item.settings is mapping
      - item.streamSettings is mapping
      - item.sniffing is mapping
    fail_msg: An inbound contains invalid settings JSON.
  loop: "{{ xui_discovered_inbounds }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true

- name: Collect current inbound tags
  ansible.builtin.set_fact:
    xui_discovered_inbound_tags: >-
      {{ xui_discovered_inbounds | map(attribute='tag') | list }}

- name: Reject duplicate current tags
  ansible.builtin.assert:
    that:
      - >-
        xui_discovered_inbound_tags | unique | length
        == xui_discovered_inbound_tags | length
    fail_msg: The inbound API returned duplicate tags. Resolve them before reconciliation.

- name: Initialize inbound discovery results
  ansible.builtin.set_fact:
    xui_existing_managed_inbounds: []
    xui_managed_inbound_tag_counts: []
    xui_unmanaged_inbound_listener_conflicts: []
  no_log: true

- name: Count managed inbound tags
  ansible.builtin.set_fact:
    xui_managed_inbound_tag_counts: >-
      {{ xui_managed_inbound_tag_counts
         + [{
           'name': item.name,
           'tag': item.payload.tag,
           'count': xui_discovered_inbounds
             | selectattr('tag', 'equalto', item.payload.tag)
             | list
             | length
         }] }}
  loop: "{{ xui_managed_inbounds }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Collect existing managed inbounds
  ansible.builtin.set_fact:
    xui_existing_managed_inbounds: >-
      {{ xui_existing_managed_inbounds
         + [xui_discovered_inbounds
           | selectattr('tag', 'equalto', item.payload.tag)
           | first] }}
  loop: "{{ xui_managed_inbounds }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    xui_discovered_inbounds
    | selectattr('tag', 'equalto', item.payload.tag)
    | list
    | length == 1
  no_log: true

- name: Find unmanaged listener conflicts
  ansible.builtin.set_fact:
    xui_unmanaged_inbound_listener_conflicts: >-
      {{ xui_unmanaged_inbound_listener_conflicts
         + [{
           'managed_name': item.1.name,
           'existing_id': item.0.id,
           'existing_tag': item.0.tag,
           'listen': item.0.listen,
           'port': item.0.port
         }] }}
  loop: "{{ xui_discovered_inbounds | product(xui_managed_inbounds) | list }}"
  loop_control:
    label: "{{ item.1.name }}"
  when:
    - item.0.tag not in xui_managed_inbound_tags
    - item.0.port | int == item.1.payload.port | int
    - >-
      item.0.listen == item.1.payload.listen or
      item.0.listen in ['', '0.0.0.0', '::', '[::]'] or
      item.1.payload.listen in ['', '0.0.0.0', '::', '[::]']
  no_log: true

- name: Reject unmanaged listener conflicts
  ansible.builtin.assert:
    that:
      - xui_unmanaged_inbound_listener_conflicts | length == 0
    fail_msg: >-
      Unmanaged inbounds occupy managed listeners:
      {{ xui_unmanaged_inbound_listener_conflicts }}

- name: Initialize managed inbound reconciliation plan
  ansible.builtin.set_fact:
    xui_managed_inbound_plan: []
  no_log: true

- name: Plan managed inbound reconciliation
  ansible.builtin.set_fact:
    xui_managed_inbound_plan: >-
      {{ xui_managed_inbound_plan
         + [{
           'name': item.name,
           'tag': item.payload.tag,
           'id': current_inbound.id | default(none),
           'action': (
             'create' if current_matches | length == 0
             else 'no-op' if current_payload_subset == item.payload
             else 'update'
           ),
           'desired_payload': item.payload,
           'api_payload': item.payload | combine({
             'settings': item.payload.settings | to_json,
             'streamSettings': item.payload.streamSettings | to_json,
             'sniffing': item.payload.sniffing | to_json
           })
         }] }}
  vars:
    current_matches: >-
      {{ xui_discovered_inbounds
         | selectattr('tag', 'equalto', item.payload.tag)
         | list }}
    current_inbound: "{{ current_matches | first | default({}) }}"
    current_payload_subset: >-
      {{ current_inbound
         | dict2items
         | selectattr('key', 'in', item.payload.keys() | list)
         | items2dict
         if current_matches | length == 1 else {} }}
  loop: "{{ xui_managed_inbounds }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Collect managed inbound changes
  ansible.builtin.set_fact:
    xui_managed_inbound_changes: >-
      {{ xui_managed_inbound_plan
         | rejectattr('action', 'equalto', 'no-op')
         | list }}
  no_log: true

- name: Show inbound reconciliation plan
  ansible.builtin.debug:
    msg:
      current_count: "{{ xui_discovered_inbounds | length }}"
      managed_tags: "{{ xui_managed_inbound_tag_counts }}"
      changes: >-
        {{ xui_managed_inbound_changes
           | map(attribute='name')
           | zip(xui_managed_inbound_changes | map(attribute='action'))
           | map('join', ':')
           | list }}
  changed_when: >-
    ansible_check_mode and xui_managed_inbound_changes | length > 0

- name: Prepare inbound database backup directory
  ansible.builtin.file:
    path: /var/backups/x-ui
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - xui_config_phase == 'apply'
    - xui_managed_inbound_changes | length > 0
    - not ansible_check_mode

- name: Set inbound database backup path
  ansible.builtin.set_fact:
    xui_inbound_backup_path: >-
      /var/backups/x-ui/x-ui-inbounds-{{ ansible_date_time.iso8601_basic_short }}.db
  when:
    - xui_config_phase == 'apply'
    - xui_managed_inbound_changes | length > 0
    - not ansible_check_mode

- name: Back up database before inbound changes
  ansible.builtin.command:
    argv:
      - sqlite3
      - /etc/x-ui/x-ui.db
      - ".backup '{{ xui_inbound_backup_path }}'"
  changed_when: true
  when:
    - xui_config_phase == 'apply'
    - xui_managed_inbound_changes | length > 0
    - not ansible_check_mode

- name: Create managed inbounds
  ansible.builtin.uri:
    url: "{{ xui_api_base_url }}/inbounds/add"
    method: POST
    headers:
      Authorization: "Bearer {{ xui_api_token }}"
    body_format: json
    body: "{{ item.api_payload }}"
    status_code: 200
  register: xui_inbound_create
  changed_when: true
  failed_when: >-
    xui_inbound_create.status | default(0) != 200 or
    xui_inbound_create.json.success | default(false) != true
  loop: "{{ xui_managed_inbound_changes | selectattr('action', 'equalto', 'create') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when:
    - xui_config_phase == 'apply'
    - not ansible_check_mode

- name: Update managed inbounds
  ansible.builtin.uri:
    url: "{{ xui_api_base_url }}/inbounds/update/{{ item.id }}"
    method: POST
    headers:
      Authorization: "Bearer {{ xui_api_token }}"
    body_format: json
    body: "{{ item.api_payload }}"
    status_code: 200
  register: xui_inbound_update
  changed_when: true
  failed_when: >-
    xui_inbound_update.status | default(0) != 200 or
    xui_inbound_update.json.success | default(false) != true
  loop: "{{ xui_managed_inbound_changes | selectattr('action', 'equalto', 'update') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when:
    - xui_config_phase == 'apply'
    - not ansible_check_mode

- name: Verify managed inbounds converged
  ansible.builtin.assert:
    that:
      - xui_managed_inbound_changes | length == 0
    fail_msg: Managed inbounds did not converge.
  when: xui_config_phase == 'verify'
