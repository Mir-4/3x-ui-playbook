---
- name: Check for the x-ui binary
  ansible.builtin.stat:
    path: /usr/local/x-ui/x-ui
  register: xui_binary

- name: Read the installed x-ui version
  ansible.builtin.command:
    argv:
      - /usr/local/x-ui/x-ui
      - -v
  register: xui_version_probe
  failed_when: false
  changed_when: false
  when: xui_binary.stat.exists

- name: Set version facts
  ansible.builtin.set_fact:
    xui_installed_version: "{{ xui_version_probe.stdout | default('') | trim }}"
    xui_expected_version: "{{ xui_version | regex_replace('^v', '') }}"

- name: Decide whether installation is needed
  ansible.builtin.set_fact:
    xui_needs_install: >-
      {{ not xui_binary.stat.exists or
         (xui_version_probe.rc | default(1)) != 0 or
         xui_installed_version != xui_expected_version }}

- name: Create the backup directory
  ansible.builtin.file:
    path: /var/backups/x-ui
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: xui_needs_install

- name: Set upgrade backup path
  ansible.builtin.set_fact:
    xui_upgrade_backup_path: >-
      /var/backups/x-ui/x-ui-{{ ansible_date_time.iso8601_basic_short }}.db
  when: xui_needs_install

- name: Check for the x-ui database
  ansible.builtin.stat:
    path: /etc/x-ui/x-ui.db
  register: xui_database
  when: xui_needs_install

- name: Back up the database before install or upgrade
  ansible.builtin.command:
    argv:
      - sqlite3
      - /etc/x-ui/x-ui.db
      - ".backup '{{ xui_upgrade_backup_path }}'"
  when: xui_needs_install and xui_database.stat.exists
  changed_when: true

- name: Download the pinned x-ui installer
  ansible.builtin.get_url:
    url: "{{ xui_release_script_url }}"
    dest: "{{ xui_installer_path }}"
    owner: root
    group: root
    mode: "0700"
  when: xui_needs_install

- name: Install or upgrade x-ui
  ansible.builtin.command:
    cmd: "{{ xui_installer_path }} {{ xui_version }}"
  environment:
    XUI_NONINTERACTIVE: "1"
    XUI_PANEL_PORT: "{{ xui_panel_port }}"
    XUI_WEB_BASE_PATH: "{{ xui_panel_path }}"
    XUI_SSL_MODE: "{{ xui_ssl_mode }}"
    XUI_DB_TYPE: "{{ xui_db_type }}"
  no_log: true
  when: xui_needs_install
  changed_when: true

- name: Read the installed x-ui version
  ansible.builtin.command:
    argv:
      - /usr/local/x-ui/x-ui
      - -v
  register: xui_version_after_install
  changed_when: false
  when: xui_needs_install

- name: Verify the installed x-ui version
  ansible.builtin.assert:
    that:
      - (xui_version_after_install.stdout | trim) == xui_expected_version
    fail_msg: >-
      The installer completed but the binary reports version
      {{ xui_version_after_install.stdout | trim }} instead of
      {{ xui_expected_version }}.
  when: xui_needs_install

- name: Save the installed version marker
  ansible.builtin.copy:
    content: "{{ xui_version }}\n"
    dest: "{{ xui_install_state_path }}"
    owner: root
    group: root
    mode: "0600"
  when: xui_needs_install

- name: Save the configuration schema marker
  ansible.builtin.copy:
    content: "{{ xui_configuration_schema_version }}\n"
    dest: "{{ xui_configuration_state_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Start and enable x-ui
  ansible.builtin.service:
    name: x-ui
    state: started
    enabled: true

- name: Read the x-ui service state
  ansible.builtin.systemd_service:
    name: x-ui
    state: started
    enabled: true
  register: xui_service_status

- name: Verify x-ui is active
  ansible.builtin.assert:
    that:
      - xui_service_status.status.ActiveState == "active"
    fail_msg: "The x-ui service is not active. Check: journalctl -u x-ui"

- name: Read the panel listen address
  ansible.builtin.command:
    argv:
      - sqlite3
      - /etc/x-ui/x-ui.db
      - "select value from settings where key = 'webListen';"
  register: xui_panel_listen_setting
  changed_when: false

- name: Bind the panel to localhost
  ansible.builtin.command:
    cmd: /usr/local/x-ui/x-ui setting -listenIP 127.0.0.1
  notify: xui listen address changed
  when: xui_panel_listen_setting.stdout | trim != '127.0.0.1'
  changed_when: true
