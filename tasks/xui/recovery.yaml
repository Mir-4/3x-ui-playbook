---
- name: Prepare recovery
  when: xui_config_phase == 'prepare'
  block:
    - name: Inspect the SQLite database
      ansible.builtin.stat:
        path: /etc/x-ui/x-ui.db
      register: xui_recovery_database

    - name: Reject a missing or empty SQLite database
      ansible.builtin.assert:
        that:
          - xui_recovery_database.stat.isreg | default(false)
          - xui_recovery_database.stat.size | default(0) > 0
        fail_msg: Refusing to back up a missing or empty SQLite database.

    - name: Create the backup directory
      ansible.builtin.file:
        path: /var/backups/x-ui
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Read the UTC timestamp
      ansible.builtin.command:
        argv: [date, -u, '+%Y%m%dT%H%M%SZ']
      register: xui_recovery_backup_time
      changed_when: false

    - name: Reserve a unique backup path
      ansible.builtin.tempfile:
        state: file
        path: /var/backups/x-ui
        prefix: "config-{{ xui_recovery_backup_time.stdout }}-"
        suffix: .db
      register: xui_recovery_backup

    - name: Back up the SQLite database
      ansible.builtin.command:
        argv:
          - sqlite3
          - /etc/x-ui/x-ui.db
          - ".backup '{{ xui_recovery_backup.path }}'"
      changed_when: true

    - name: Record the pending restart
      ansible.builtin.copy:
        dest: /etc/x-ui/ansible-config-restart-pending
        content: "{{ xui_recovery_backup.path }}\n"
        owner: root
        group: root
        mode: "0600"

- name: Restart x-ui asynchronously
  ansible.builtin.command:
    argv:
      - systemctl
      - restart
      - x-ui
  async: 45
  poll: 0
  changed_when: true
  when: xui_config_phase == 'activate'

- name: Wait for SSH after x-ui restart
  ansible.builtin.wait_for_connection:
    delay: 2
    timeout: 60
  when: xui_config_phase == 'activate'

- name: Verify x-ui after restart
  ansible.builtin.systemd_service:
    name: x-ui
    state: started
    enabled: true
  register: xui_restarted_service
  when: xui_config_phase == 'activate'

- name: Assert x-ui is active after restart
  ansible.builtin.assert:
    that:
      - xui_restarted_service.status.ActiveState == 'active'
    fail_msg: "The x-ui service is not active after restart. Check: journalctl -u x-ui"
  when: xui_config_phase == 'activate'

- name: Clear the pending restart
  ansible.builtin.file:
    path: /etc/x-ui/ansible-config-restart-pending
    state: absent
  when: xui_config_phase == 'complete'
