---
- name: Check for managed x-ui secrets
  ansible.builtin.stat:
    path: "{{ xui_managed_secrets_path }}"
  register: xui_managed_secrets_file
  no_log: true

- name: Read managed x-ui secrets
  ansible.builtin.slurp:
    src: "{{ xui_managed_secrets_path }}"
  register: xui_managed_secrets_slurp
  when: xui_managed_secrets_file.stat.exists
  no_log: true

- name: Decode managed x-ui secrets
  ansible.builtin.set_fact:
    xui_managed_secrets_existing: >-
      {{ (xui_managed_secrets_slurp.content | b64decode | from_json)
         if xui_managed_secrets_file.stat.exists else {} }}
  no_log: true

- name: Select existing or explicit REALITY secrets
  ansible.builtin.set_fact:
    xui_effective_reality_private_key: >-
      {{ xui_reality_private_key
         if xui_reality_private_key | default('') | length > 0
         else xui_managed_secrets_existing.reality_private_key | default('') }}
    xui_effective_reality_public_key: >-
      {{ xui_reality_public_key
         if xui_reality_public_key | default('') | length > 0
         else xui_managed_secrets_existing.reality_public_key | default('') }}
    xui_effective_reality_short_ids: >-
      {{ xui_reality_short_ids
         if xui_reality_short_ids | default([]) | length > 0
         else xui_managed_secrets_existing.reality_short_ids | default([]) }}
  no_log: true

- name: Locate the bundled Xray binary
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/x-ui/bin/xray
    - /usr/local/x-ui/bin/xray-linux-amd64
    - /usr/local/x-ui/bin/xray-linux-arm64
    - /usr/local/x-ui/bin/xray-linux-arm32
    - /usr/local/x-ui/bin/xray-linux-386
  register: xui_xray_binary_candidates
  no_log: true

- name: Store the bundled Xray binary path
  ansible.builtin.set_fact:
    xui_xray_binary_path: >-
      {{ xui_xray_binary_candidates.results
         | selectattr('stat.exists')
         | selectattr('stat.executable')
         | map(attribute='item')
         | first | default('') }}
  no_log: true

- name: Require bundled Xray for generated REALITY keys
  ansible.builtin.assert:
    that:
      - >-
        xui_effective_reality_private_key | length > 0 and
        xui_effective_reality_public_key | length > 0 or
        xui_xray_binary_path | length > 0
    fail_msg: The playbook needs the bundled Xray binary to generate REALITY keys.
  no_log: true

- name: Generate a REALITY X25519 keypair
  ansible.builtin.command:
    argv:
      - "{{ xui_xray_binary_path }}"
      - x25519
  register: xui_reality_keypair
  changed_when: false
  check_mode: false
  when: >-
    xui_effective_reality_private_key | length == 0 or
    xui_effective_reality_public_key | length == 0
  no_log: true

- name: Store generated REALITY keypair for this run
  ansible.builtin.set_fact:
    xui_effective_reality_private_key: >-
      {{ xui_reality_keypair.stdout_lines
         | select('match', '^Private[Kk]ey: ')
         | first
         | regex_replace('^Private[Kk]ey: ', '') }}
    xui_effective_reality_public_key: >-
      {{ xui_reality_keypair.stdout_lines
         | select('match', '^(Public key|Password \(PublicKey\)): ')
         | first
         | regex_replace('^(Public key|Password \\(PublicKey\\)): ', '') }}
  when:
    - xui_reality_keypair is defined
    - not xui_reality_keypair.skipped | default(false)
  no_log: true

- name: Generate a REALITY short ID
  ansible.builtin.command:
    argv:
      - "{{ xui_xray_binary_path }}"
      - uuid
  register: xui_reality_short_id_uuid
  changed_when: false
  check_mode: false
  when: xui_effective_reality_short_ids | length == 0
  no_log: true

- name: Store generated REALITY short ID for this run
  ansible.builtin.set_fact:
    xui_effective_reality_short_ids:
      - "{{ xui_reality_short_id_uuid.stdout | trim | regex_replace('-', '') | regex_replace('^(.{16}).*$', '\\1') }}"
  when:
    - xui_reality_short_id_uuid is defined
    - not xui_reality_short_id_uuid.skipped | default(false)
  no_log: true

- name: Validate managed REALITY secrets
  ansible.builtin.assert:
    that:
      - xui_effective_reality_private_key | length > 0
      - xui_effective_reality_public_key | length > 0
      - xui_effective_reality_short_ids is sequence
      - xui_effective_reality_short_ids is not string
      - xui_effective_reality_short_ids | length > 0
      - xui_effective_reality_short_ids | select('match', '^[0-9a-fA-F]{2,16}$') | list | length == xui_effective_reality_short_ids | length
    fail_msg: REALITY private/public keys and 2-16 hex-character short IDs are required.
  no_log: true

- name: Persist managed x-ui secrets
  ansible.builtin.copy:
    dest: "{{ xui_managed_secrets_path }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      {{ {
        'reality_private_key': xui_effective_reality_private_key,
        'reality_public_key': xui_effective_reality_public_key,
        'reality_short_ids': xui_effective_reality_short_ids
      } | to_nice_json }}
  when: not ansible_check_mode
  no_log: true

- name: Publish managed x-ui secrets to later tasks
  ansible.builtin.set_fact:
    xui_reality_private_key: "{{ xui_effective_reality_private_key }}"
    xui_reality_public_key: "{{ xui_effective_reality_public_key }}"
    xui_reality_short_ids: "{{ xui_effective_reality_short_ids }}"
  no_log: true
